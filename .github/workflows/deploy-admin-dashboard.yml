name: Deploy Admin Dashboard to Contabo VPS

on:
  push:
    branches:
      - claude/android-kiosk-silent-update-s7wn9q
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/deploy-admin-dashboard.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "admin-dashboard/"
          target: "/opt/karika-admin-dashboard"
          rm: true
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/karika-admin-dashboard

            echo "🚀 Building and starting the container..."
            docker compose up -d --build

            echo "⏳ Čekanje na zdravlje servisa..."
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8000/docs > /dev/null; then
                echo "✅ Servis odgovara."
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Servis se nije podigao na vrijeme, zadnjih 50 linija loga:"
                docker compose logs --tail 50
                exit 1
              fi
              sleep 2
            done

            docker compose ps
            docker image prune -f
            echo "✅ Deployment završen uspešno!"
