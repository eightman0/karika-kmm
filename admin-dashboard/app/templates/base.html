<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Karika Ops{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  {% if request.session.get("logged_in") %}
  <nav class="topnav">
    <a href="/devices" class="brand">Karika Ops</a>
    <div class="nav-links">
      <a href="/devices" class="{{ 'active' if active_page == 'devices' else '' }}">Uređaji</a>
      <span class="nav-sep">|</span>
      <a href="/versions" class="{{ 'active' if active_page == 'versions' else '' }}">Verzije</a>
      <span class="nav-sep">|</span>
      <a href="/analitika" class="{{ 'active' if active_page == 'analitika' else '' }}">Analitika</a>
      <span class="nav-sep">|</span>
      <a href="/provisioning" class="{{ 'active' if active_page == 'provisioning' else '' }}">Provisioning</a>
    </div>
    <a href="/logout" class="nav-logout">Odjava</a>
  </nav>
  {% endif %}
  <main class="{{ 'login-shell' if active_page == 'login' else '' }}">
    {% block content %}{% endblock %}
  </main>

  <!-- Transient confirmation toast for actions that should not navigate away from the current
       page (e.g. a per-row action triggered from the devices list) - a `?toast=...` query param
       on any redirect back to the same page shows this, then gets stripped from the URL so a
       refresh doesn't re-show it. -->
  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
  <script>
    function showSnackbar(message) {
      var el = document.getElementById('snackbar');
      if (!el || !message) return;
      el.textContent = message;
      el.classList.add('visible');
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(function () { el.classList.remove('visible'); }, 3500);
    }
    (function () {
      var params = new URLSearchParams(window.location.search);
      var toast = params.get('toast');
      if (!toast) return;
      showSnackbar(toast);
      params.delete('toast');
      var qs = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    })();
  </script>

  <!-- Shared confirmation modal - replaces the native confirm() every dangerous/notable form
       submit on this site used to show. Any <form onsubmit="return confirmSubmit(this, '...')">
       reuses this single dialog instead of each page building its own. -->
  <dialog id="confirm-modal" class="modal">
    <div class="modal-body">
      <h2>Potvrda</h2>
      <p id="confirm-modal-message"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('confirm-modal').close()">Otkaži</button>
        <button type="button" id="confirm-modal-confirm" class="btn btn-primary">Potvrdi</button>
      </div>
    </div>
  </dialog>
  <script>
    // Drop-in replacement for onsubmit="return confirm('...')": shows the shared dialog above
    // instead of a native confirm() popup, then re-submits the same form if confirmed. `danger`
    // (optional) styles the confirm button red for destructive actions (factory reset, delete).
    function confirmSubmit(form, message, danger) {
      if (form.dataset.confirmed === 'true') {
        delete form.dataset.confirmed;
        return true;
      }
      document.getElementById('confirm-modal-message').textContent = message;
      var confirmBtn = document.getElementById('confirm-modal-confirm');
      confirmBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
      confirmBtn.onclick = function () {
        document.getElementById('confirm-modal').close();
        form.dataset.confirmed = 'true';
        if (form.requestSubmit) form.requestSubmit(); else form.submit();
      };
      document.getElementById('confirm-modal').showModal();
      return false;
    }
  </script>
</body>
</html>
